name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build debug CLI for integration tests
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
      - name: Security audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: deepsearch-linux-x86_64
            binary: deepsearch
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: deepsearch-macos-x86_64
            binary: deepsearch
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: deepsearch-macos-aarch64
            binary: deepsearch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: deepsearch-windows-x86_64.exe
            binary: deepsearch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native debug CLI for integration tests
        run: cargo build --locked --target ${{ matrix.target }}
      - name: Native tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage Unix binary and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Stage Windows binary and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Set-Content "${{ matrix.artifact }}.sha256"
      - name: Smoke staged Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'CI_STAGED_BINARY_NEEDLE\n' > deepsearch-smoke.txt
          "./${{ matrix.artifact }}" -F CI_STAGED_BINARY_NEEDLE deepsearch-smoke.txt | grep -F CI_STAGED_BINARY_NEEDLE
      - name: Smoke staged Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'CI_STAGED_BINARY_NEEDLE' | Set-Content deepsearch-smoke.txt
          $output = & ".\${{ matrix.artifact }}" -F CI_STAGED_BINARY_NEEDLE deepsearch-smoke.txt
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'CI_STAGED_BINARY_NEEDLE') { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
