name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build debug CLI for integration tests
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
      - name: Security audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}"

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: querybit-linux-x86_64
            binary: querybit
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: querybit-macos-x86_64
            binary: querybit
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: querybit-macos-aarch64
            binary: querybit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: querybit-windows-x86_64.exe
            binary: querybit.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build native debug CLI for integration tests
        run: cargo build --locked --target ${{ matrix.target }}
      - name: Native tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage Unix binary and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Stage Windows binary and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Set-Content "${{ matrix.artifact }}.sha256"
      - name: Verify Linux artifact is static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file "${{ matrix.artifact }}"
          if readelf -l "${{ matrix.artifact }}" | grep -q 'Requesting program interpreter'; then
            echo 'Linux artifact unexpectedly has a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "${{ matrix.artifact }}" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'Linux artifact unexpectedly has shared-library dependencies' >&2
            exit 1
          fi
      - name: Smoke staged Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'CI_STAGED_BINARY_NEEDLE\n' > querybit-smoke.txt
          "./${{ matrix.artifact }}" -F CI_STAGED_BINARY_NEEDLE querybit-smoke.txt | grep -F CI_STAGED_BINARY_NEEDLE
      - name: Smoke staged Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'CI_STAGED_BINARY_NEEDLE' | Set-Content querybit-smoke.txt
          $output = & ".\${{ matrix.artifact }}" -F CI_STAGED_BINARY_NEEDLE querybit-smoke.txt
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'CI_STAGED_BINARY_NEEDLE') { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
